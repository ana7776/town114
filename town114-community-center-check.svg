<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">주민센터 방문 준비 순서</title><desc id="desc">업무 구분, 신청자 확인, 준비물 확인, 접수시간 확인의 네 단계 안내 도식</desc><rect width="1200" height="620" rx="28" fill="#fff8ef"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#754318">주민센터 방문 전 준비 순서</text><g font-family="Arial,sans-serif"><g transform="translate(70 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#e1ad79" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#c96a24"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#754318">업무 구분</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#8a6242">전입·서류·복지·생활</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#8a6242">민원을 먼저 구분</text></g><g transform="translate(335 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#e1ad79" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#c96a24"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#754318">신청자 확인</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#8a6242">본인·가족·대리인</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#8a6242">신청 유형을 확인</text></g><g transform="translate(600 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#e1ad79" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#c96a24"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#754318">준비물 확인</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#8a6242">신분증·위임장·계약서와</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#8a6242">제출처 안내를 확인</text></g><g transform="translate(865 165)"><rect width="265" height="270" rx="22" fill="#754318"/><circle cx="132" cy="65" r="35" fill="#ffd166"/><text x="132" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#754318">4</text><text x="132" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">접수 확인</text><text x="132" y="180" text-anchor="middle" font-size="18" fill="#fff0dc">담당 창구와</text><text x="132" y="208" text-anchor="middle" font-size="18" fill="#fff0dc">접수 마감 문의</text></g></g><text x="70" y="525" font-family="Arial,sans-serif" font-size="21" fill="#8a6242">같은 서류라도 제출처와 표시 항목에 따라 달라질 수 있으므로 방문 전 공식 안내를 확인하세요.</text></svg>