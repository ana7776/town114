<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">약국 야간·주말 방문 확인표</title><desc id="desc">운영시간, 조제 가능 여부, 재고, 대체 약국을 확인하는 순서</desc><rect width="1200" height="620" rx="28" fill="#f2fbf8"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#15594f">야간·주말 약국은 이렇게 확인하세요</text><g font-family="Arial,sans-serif"><g transform="translate(70 160)"><rect width="245" height="285" rx="22" fill="#fff" stroke="#86cabc" stroke-width="4"/><text x="122" y="75" text-anchor="middle" font-size="48">☀</text><text x="122" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#15594f">운영 여부</text><text x="122" y="185" text-anchor="middle" font-size="19" fill="#4d746d">오늘 운영하는지</text><text x="122" y="215" text-anchor="middle" font-size="19" fill="#4d746d">먼저 확인</text></g><g transform="translate(335 160)"><rect width="245" height="285" rx="22" fill="#fff" stroke="#86cabc" stroke-width="4"/><text x="122" y="75" text-anchor="middle" font-size="48">▣</text><text x="122" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#15594f">조제 가능</text><text x="122" y="185" text-anchor="middle" font-size="19" fill="#4d746d">처방전 조제와</text><text x="122" y="215" text-anchor="middle" font-size="19" fill="#4d746d">접수 마감 문의</text></g><g transform="translate(600 160)"><rect width="245" height="285" rx="22" fill="#fff" stroke="#86cabc" stroke-width="4"/><text x="122" y="75" text-anchor="middle" font-size="48">✓</text><text x="122" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#15594f">재고 확인</text><text x="122" y="185" text-anchor="middle" font-size="19" fill="#4d746d">필요한 약이 있는지</text><text x="122" y="215" text-anchor="middle" font-size="19" fill="#4d746d">전화로 확인</text></g><g transform="translate(865 160)"><rect width="265" height="285" rx="22" fill="#15594f"/><text x="132" y="75" text-anchor="middle" font-size="48" fill="#fff">↗</text><text x="132" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">대체 후보</text><text x="132" y="185" text-anchor="middle" font-size="19" fill="#dff7f2">불가하면 가까운</text><text x="132" y="215" text-anchor="middle" font-size="19" fill="#dff7f2">다른 약국 확인</text></g></g><text x="70" y="535" font-family="Arial,sans-serif" font-size="21" fill="#356b63">지도 표시만으로 야간 조제 가능 여부를 단정하지 말고 전화로 재확인하세요.</text></svg>