<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">자동차 정비소 선택 순서</title><desc id="desc">증상 정리, 정비 범위 확인, 견적 분리, 보증 기준 확인의 네 단계 안내 도식</desc><rect width="1200" height="620" rx="28" fill="#f4f7fb"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#203a5f">정비소 방문 전 확인 순서</text><g font-family="Arial,sans-serif"><g transform="translate(70 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#8fb0d4" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#3778b8"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#203a5f">증상 정리</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#55708f">소리·경고등·진동과</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#55708f">발생 조건을 메모</text></g><g transform="translate(335 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#8fb0d4" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#3778b8"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#203a5f">범위 확인</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#55708f">진단·경정비·검사 등</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#55708f">가능 범위를 문의</text></g><g transform="translate(600 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#8fb0d4" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#3778b8"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#203a5f">견적 분리</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#55708f">공임·부품·추가비를</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#55708f">나눠 확인</text></g><g transform="translate(865 165)"><rect width="265" height="270" rx="22" fill="#203a5f"/><circle cx="132" cy="65" r="35" fill="#ffd166"/><text x="132" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#203a5f">4</text><text x="132" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">보증 확인</text><text x="132" y="180" text-anchor="middle" font-size="18" fill="#e4f0ff">수리 후 보증과</text><text x="132" y="208" text-anchor="middle" font-size="18" fill="#e4f0ff">재점검 기준을 문의</text></g></g><text x="70" y="525" font-family="Arial,sans-serif" font-size="21" fill="#45617f">공공데이터의 영업상태만으로 작업 가능 여부나 견적을 확정하지 말고 방문 전 전화로 확인하세요.</text></svg>