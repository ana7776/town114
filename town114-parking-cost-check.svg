<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">공영주차장 비용과 동선 확인 순서</title><desc id="desc">체류시간, 기본요금, 할인, 입출구와 대체 주차장을 확인하는 네 단계 안내 도식</desc><rect width="1200" height="620" rx="28" fill="#eefaf6"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#15594f">주차장 선택 전 확인 순서</text><g font-family="Arial,sans-serif"><g transform="translate(70 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#7bc4b3" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#218c79"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#15594f">체류시간</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#4d746d">몇 시간 머무는지</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#4d746d">먼저 예상</text></g><g transform="translate(335 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#7bc4b3" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#218c79"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#15594f">요금 계산</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#4d746d">기본·추가·일 최대</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#4d746d">요금을 비교</text></g><g transform="translate(600 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#7bc4b3" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#218c79"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#15594f">할인 확인</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#4d746d">경차·장애인·다자녀</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#4d746d">조건을 확인</text></g><g transform="translate(865 165)"><rect width="265" height="270" rx="22" fill="#15594f"/><circle cx="132" cy="65" r="35" fill="#ffd166"/><text x="132" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#15594f">4</text><text x="132" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">동선 확인</text><text x="132" y="180" text-anchor="middle" font-size="18" fill="#e0faf4">입구·출구와 만차 시</text><text x="132" y="208" text-anchor="middle" font-size="18" fill="#e0faf4">대체 후보를 확인</text></g></g><text x="70" y="525" font-family="Arial,sans-serif" font-size="21" fill="#356b63">공공데이터 기준일과 현장 요금·만차 여부는 다를 수 있으므로 방문 전 공식 안내를 확인하세요.</text></svg>