<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">데이터 스냅샷과 현재 운영정보의 차이</title><desc id="desc">스냅샷 데이터는 기본정보 확인에 쓰고 현재 운영정보는 공식 안내와 전화로 확인해야 한다는 비교 도식</desc><rect width="1200" height="620" rx="28" fill="#fff9f1"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#7c3f13">스냅샷 정보와 현재 운영정보는 다릅니다</text><g font-family="Arial,sans-serif"><rect x="85" y="160" width="450" height="300" rx="24" fill="#fff" stroke="#e7a66e" stroke-width="4"/><text x="310" y="225" text-anchor="middle" font-size="30" font-weight="700" fill="#7c3f13">공공데이터 스냅샷</text><text x="125" y="285" font-size="22" fill="#8b6040">확인 가능</text><text x="150" y="325" font-size="20" fill="#8b6040">• 시설명, 주소, 좌표</text><text x="150" y="360" font-size="20" fill="#8b6040">• 공개 전화번호, 개설일</text><text x="150" y="395" font-size="20" fill="#8b6040">• 진료과·시설 기본정보</text><rect x="665" y="160" width="450" height="300" rx="24" fill="#7c3f13"/><text x="890" y="225" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">방문 당일 확인</text><text x="705" y="285" font-size="22" fill="#fff1df">반드시 재확인</text><text x="730" y="325" font-size="20" fill="#fff1df">• 오늘 운영·접수 마감</text><text x="730" y="360" font-size="20" fill="#fff1df">• 조제 가능·재고 여부</text><text x="730" y="395" font-size="20" fill="#fff1df">• 휴진·변경·현장 상황</text><path d="M540 310h120" stroke="#d88945" stroke-width="8"/><path d="M625 285l35 25-35 25" fill="none" stroke="#d88945" stroke-width="8"/></g><text x="70" y="535" font-family="Arial,sans-serif" font-size="21" fill="#8b6040">TOWN114는 기준일과 출처를 표시하며, 최종 판단은 기관의 최신 안내를 우선합니다.</text></svg>