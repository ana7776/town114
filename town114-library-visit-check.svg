<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">공공도서관 방문 전 확인 순서</title><desc id="desc">휴관일, 운영시간, 이용 목적, 준비물과 예약을 확인하는 네 단계 안내 도식</desc><rect width="1200" height="620" rx="28" fill="#f5f2ff"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#47306d">도서관 방문 전 확인 순서</text><g font-family="Arial,sans-serif"><g transform="translate(70 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#a998d2" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#7755a9"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#47306d">휴관일</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#665482">정기 휴관과 임시 휴관</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#665482">공지 여부 확인</text></g><g transform="translate(335 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#a998d2" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#7755a9"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#47306d">운영시간</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#665482">자료실·열람실별</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#665482">시간 차이를 확인</text></g><g transform="translate(600 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#a998d2" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#7755a9"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#47306d">이용 목적</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#665482">대출·열람·프로그램</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#665482">필요한 서비스를 구분</text></g><g transform="translate(865 165)"><rect width="265" height="270" rx="22" fill="#47306d"/><circle cx="132" cy="65" r="35" fill="#ffd166"/><text x="132" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#47306d">4</text><text x="132" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">준비물</text><text x="132" y="180" text-anchor="middle" font-size="18" fill="#f0eaff">회원증·예약·</text><text x="132" y="208" text-anchor="middle" font-size="18" fill="#f0eaff">동반 조건 확인</text></g></g><text x="70" y="525" font-family="Arial,sans-serif" font-size="21" fill="#665482">운영시간과 휴관일은 시설별로 다를 수 있으므로 공식 도서관 안내를 기준으로 확인하세요.</text></svg>