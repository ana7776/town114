<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">TOWN114 공공데이터 확인 흐름</title>
<desc id="desc">공공데이터 수집, 기준일 표시, 사람이 읽는 설명, 공식 확인의 네 단계 흐름을 보여주는 안내 도식</desc>
<rect width="1200" height="700" rx="32" fill="#fff7ed"/>
<text x="70" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#7c3f13">공공데이터를 확인하는 방법</text>
<text x="70" y="140" font-family="Arial,sans-serif" font-size="22" fill="#8b6040">데이터 기준일과 실제 운영정보를 구분해 읽어야 합니다.</text>
<g font-family="Arial,sans-serif" stroke="#d88945" stroke-width="5" fill="none"><path d="M300 350H375"/><path d="M585 350H660"/><path d="M870 350H945"/><path d="M355 330l20 20-20 20"/><path d="M640 330l20 20-20 20"/><path d="M925 330l20 20-20 20"/></g>
<g font-family="Arial,sans-serif">
<g transform="translate(70 230)"><rect width="230" height="240" rx="24" fill="#fff" stroke="#e7a66e" stroke-width="4"/><circle cx="115" cy="65" r="35" fill="#d66b25"/><text x="115" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="115" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3f13">공공데이터</text><text x="115" y="180" text-anchor="middle" font-size="18" fill="#8b6040">제공기관 자료와</text><text x="115" y="207" text-anchor="middle" font-size="18" fill="#8b6040">필드를 확인</text></g>
<g transform="translate(355 230)"><rect width="230" height="240" rx="24" fill="#fff" stroke="#e7a66e" stroke-width="4"/><circle cx="115" cy="65" r="35" fill="#d66b25"/><text x="115" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="115" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3f13">기준일 표시</text><text x="115" y="180" text-anchor="middle" font-size="18" fill="#8b6040">수집 시점과 개설일을</text><text x="115" y="207" text-anchor="middle" font-size="18" fill="#8b6040">혼동하지 않게 표시</text></g>
<g transform="translate(640 230)"><rect width="230" height="240" rx="24" fill="#fff" stroke="#e7a66e" stroke-width="4"/><circle cx="115" cy="65" r="35" fill="#d66b25"/><text x="115" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="115" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3f13">이용자 설명</text><text x="115" y="180" text-anchor="middle" font-size="18" fill="#8b6040">목록보다 판단 기준과</text><text x="115" y="207" text-anchor="middle" font-size="18" fill="#8b6040">체크리스트를 제공</text></g>
<g transform="translate(925 230)"><rect width="205" height="240" rx="24" fill="#7c3f13"/><circle cx="102" cy="65" r="35" fill="#ffd166"/><text x="102" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#7c3f13">4</text><text x="102" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">공식 확인</text><text x="102" y="180" text-anchor="middle" font-size="18" fill="#fff1df">방문 전 기관 안내와</text><text x="102" y="207" text-anchor="middle" font-size="18" fill="#fff1df">전화로 재확인</text></g>
</g>
<text x="70" y="600" font-family="Arial,sans-serif" font-size="21" fill="#8b6040">※ TOWN114의 스냅샷은 참고용이며 당일 운영, 접수, 조제 가능 여부를 보장하지 않습니다.</text>
</svg>