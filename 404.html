<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 404 페이지는 색인 대상이 아니므로 noindex 처리 -->
  <meta name="robots" content="noindex, follow">
  <title>페이지를 찾을 수 없습니다 | TOWN114</title>
  <style>
    /* TOWN114 미니멀 스타일과 톤을 맞춘 자체 포함 CSS */
    :root {
      --ink: #1c2430;
      --sub: #5b6472;
      --line: #e4e8ee;
      --accent: #1f6f5c; /* 생활정보 가이드에 어울리는 딥그린 */
      --bg: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
    }
    header a {
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 17px;
    }
    header a span { color: var(--accent); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }
    .card { max-width: 560px; width: 100%; text-align: center; }
    .code {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--accent);
      line-height: 1;
    }
    h1 { font-size: 22px; margin: 16px 0 10px; }
    p.desc { color: var(--sub); font-size: 15px; line-height: 1.7; }
    .links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .links a {
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      transition: border-color .15s, color .15s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .links a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 18px 20px;
      text-align: center;
      color: var(--sub);
      font-size: 13px;
    }
    footer a { color: var(--sub); }
  </style>
</head>
<body>
  <header>
    <a href="/"><span>Town</span>114 <small style="font-weight:400;color:var(--sub)">우리동네 생활정보</small></a>
  </header>

  <main>
    <div class="card">
      <div class="code">404</div>
      <h1>요청하신 페이지를 찾을 수 없습니다</h1>
      <p class="desc">
        주소가 바뀌었거나 삭제된 페이지일 수 있습니다.<br>
        아래에서 찾으시는 생활정보 주제로 이동해 보세요.
      </p>
      <div class="links">
        <a class="primary" href="/">홈으로 이동</a>
        <a href="/sitemap/">전체 사이트맵</a>
        <a href="/services/pharmacies/">약국 안내</a>
        <a href="/services/parking/">공영주차장</a>
        <a href="/services/community-centers/">주민센터</a>
        <a href="/contact/">오류 제보</a>
      </div>
    </div>
  </main>

  <footer>
    TOWN114 · <a href="/privacy/">개인정보처리방침</a> · <a href="/terms/">이용약관</a> · <a href="/sources/">자료 출처</a>
  </footer>
</body>
</html>
