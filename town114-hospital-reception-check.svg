<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">병원 접수 가능 여부 확인표</title><desc id="desc">운영시간, 접수 마감, 진료과, 당일 진료 여부를 방문 전에 확인하는 네 가지 항목</desc><rect width="1200" height="620" rx="28" fill="#f5f8fc"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173b68">병원 접수 전에 확인할 4가지</text><g font-family="Arial,sans-serif"><g transform="translate(70 160)"><rect width="245" height="285" rx="22" fill="#fff" stroke="#9db9d8" stroke-width="4"/><text x="122" y="75" text-anchor="middle" font-size="48">🕒</text><text x="122" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#173b68">운영시간</text><text x="122" y="185" text-anchor="middle" font-size="19" fill="#4b6380">평일·주말·공휴일</text><text x="122" y="215" text-anchor="middle" font-size="19" fill="#4b6380">운영 여부 확인</text></g><g transform="translate(335 160)"><rect width="245" height="285" rx="22" fill="#fff" stroke="#9db9d8" stroke-width="4"/><text x="122" y="75" text-anchor="middle" font-size="48">⏱</text><text x="122" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#173b68">접수 마감</text><text x="122" y="185" text-anchor="middle" font-size="19" fill="#4b6380">진료 종료 전</text><text x="122" y="215" text-anchor="middle" font-size="19" fill="#4b6380">접수 마감 시간 확인</text></g><g transform="translate(600 160)"><rect width="245" height="285" rx="22" fill="#fff" stroke="#9db9d8" stroke-width="4"/><text x="122" y="75" text-anchor="middle" font-size="48">＋</text><text x="122" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#173b68">진료과</text><text x="122" y="185" text-anchor="middle" font-size="19" fill="#4b6380">원하는 진료과와</text><text x="122" y="215" text-anchor="middle" font-size="19" fill="#4b6380">의사 진료 여부 확인</text></g><g transform="translate(865 160)"><rect width="265" height="285" rx="22" fill="#173b68"/><text x="132" y="75" text-anchor="middle" font-size="48" fill="#fff">☎</text><text x="132" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">전화 확인</text><text x="132" y="185" text-anchor="middle" font-size="19" fill="#dcecff">당일 진료와</text><text x="132" y="215" text-anchor="middle" font-size="19" fill="#dcecff">접수 가능 여부 문의</text></g></g><text x="70" y="535" font-family="Arial,sans-serif" font-size="21" fill="#315273">운영시간과 접수 마감은 다를 수 있으므로 방문 직전 공식 안내를 확인하세요.</text></svg>