<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">렌터카 예약 전 확인 순서</title><desc id="desc">차량 조건, 보험과 보증금, 주행거리, 반납 조건을 확인하는 네 단계 안내 도식</desc><rect width="1200" height="620" rx="28" fill="#f3f7ff"/><text x="70" y="86" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#254a78">렌터카 예약 전 확인 순서</text><g font-family="Arial,sans-serif"><g transform="translate(70 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#8eafd5" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#3f78b6"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">1</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#254a78">차량 조건</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#557394">차종·인원·짐과</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#557394">대여 시간을 확인</text></g><g transform="translate(335 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#8eafd5" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#3f78b6"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">2</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#254a78">보험·보증금</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#557394">자차 범위와 면책금</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#557394">보증금 조건을 확인</text></g><g transform="translate(600 165)"><rect width="245" height="270" rx="22" fill="#fff" stroke="#8eafd5" stroke-width="4"/><circle cx="122" cy="65" r="35" fill="#3f78b6"/><text x="122" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">3</text><text x="122" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#254a78">주행 조건</text><text x="122" y="180" text-anchor="middle" font-size="18" fill="#557394">주행거리·연료와</text><text x="122" y="208" text-anchor="middle" font-size="18" fill="#557394">추가 비용을 확인</text></g><g transform="translate(865 165)"><rect width="265" height="270" rx="22" fill="#254a78"/><circle cx="132" cy="65" r="35" fill="#ffd166"/><text x="132" y="78" text-anchor="middle" font-size="34" font-weight="700" fill="#254a78">4</text><text x="132" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">반납 조건</text><text x="132" y="180" text-anchor="middle" font-size="18" fill="#e7f0ff">시간·장소·세차와</text><text x="132" y="208" text-anchor="middle" font-size="18" fill="#e7f0ff">연장 비용을 확인</text></g></g><text x="70" y="525" font-family="Arial,sans-serif" font-size="21" fill="#557394">업체 목록은 비교 출발점이며, 예약 전 계약 조건과 실제 대여 가능 여부를 공식 안내로 확인하세요.</text></svg>