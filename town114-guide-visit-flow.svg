<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">TOWN114 방문 전 정보 확인 흐름</title><desc id="desc">방문 목적 선택, 핵심 조건 비교, 공식 안내 확인, 방문 결정의 네 단계를 보여주는 시각화</desc><rect width="1200" height="560" rx="30" fill="#f5f8fc"/><text x="70" y="75" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#173b68">방문 전에는 이 순서로 확인하세요</text><text x="70" y="115" font-family="Arial,sans-serif" font-size="21" fill="#58708e">목록을 보기 전에 필요한 판단 기준을 먼저 정리하면 헛걸음을 줄일 수 있습니다.</text><g stroke="#8db1d7" stroke-width="6" fill="none"><path d="M285 285H350"/><path d="M570 285H635"/><path d="M855 285H920"/><path d="M330 264l22 21-22 21"/><path d="M615 264l22 21-22 21"/><path d="M900 264l22 21-22 21"/></g><g font-family="Arial,sans-serif"><g transform="translate(70 180)"><rect width="215" height="210" rx="24" fill="#fff" stroke="#8db1d7" stroke-width="4"/><circle cx="108" cy="60" r="34" fill="#3d7eba"/><text x="108" y="72" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">1</text><text x="108" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#173b68">목적 선택</text><text x="108" y="160" text-anchor="middle" font-size="18" fill="#58708e">병원·약국·주차</text><text x="108" y="186" text-anchor="middle" font-size="18" fill="#58708e">민원·도서관 등</text></g><g transform="translate(355 180)"><rect width="215" height="210" rx="24" fill="#fff" stroke="#8db1d7" stroke-width="4"/><circle cx="108" cy="60" r="34" fill="#3d7eba"/><text x="108" y="72" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">2</text><text x="108" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#173b68">조건 비교</text><text x="108" y="160" text-anchor="middle" font-size="18" fill="#58708e">시간·요금·준비물</text><text x="108" y="186" text-anchor="middle" font-size="18" fill="#58708e">접수·예약 확인</text></g><g transform="translate(640 180)"><rect width="215" height="210" rx="24" fill="#fff" stroke="#8db1d7" stroke-width="4"/><circle cx="108" cy="60" r="34" fill="#3d7eba"/><text x="108" y="72" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">3</text><text x="108" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#173b68">공식 확인</text><text x="108" y="160" text-anchor="middle" font-size="18" fill="#58708e">기관 공지·전화</text><text x="108" y="186" text-anchor="middle" font-size="18" fill="#58708e">기준일 재확인</text></g><g transform="translate(925 180)"><rect width="205" height="210" rx="24" fill="#173b68"/><circle cx="103" cy="60" r="34" fill="#ffd166"/><text x="103" y="72" text-anchor="middle" font-size="32" font-weight="700" fill="#173b68">4</text><text x="103" y="122" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">방문 결정</text><text x="103" y="160" text-anchor="middle" font-size="18" fill="#e4f0ff">주소와 조건을</text><text x="103" y="186" text-anchor="middle" font-size="18" fill="#e4f0ff">확인하고 이동</text></g></g><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="70" y="445" width="145" height="42" rx="21" fill="#e7f1fb"/><text x="142" y="473" text-anchor="middle" fill="#2f679c">운영시간</text><rect x="230" y="445" width="105" height="42" rx="21" fill="#e7f1fb"/><text x="282" y="473" text-anchor="middle" fill="#2f679c">요금</text><rect x="350" y="445" width="125" height="42" rx="21" fill="#e7f1fb"/><text x="412" y="473" text-anchor="middle" fill="#2f679c">준비물</text><rect x="490" y="445" width="125" height="42" rx="21" fill="#e7f1fb"/><text x="552" y="473" text-anchor="middle" fill="#2f679c">접수·예약</text><rect x="630" y="445" width="105" height="42" rx="21" fill="#e7f1fb"/><text x="682" y="473" text-anchor="middle" fill="#2f679c">전화</text><rect x="750" y="445" width="145" height="42" rx="21" fill="#e7f1fb"/><text x="822" y="473" text-anchor="middle" fill="#2f679c">공식 출처</text></g></svg>