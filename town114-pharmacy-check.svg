<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">약국 방문 전 확인 순서</title>
<desc id="desc">약국 위치 확인, 운영시간 확인, 조제 가능 여부 문의, 대체 약국 확인의 네 단계를 보여주는 안내 도식</desc>
<rect width="1200" height="700" rx="32" fill="#effaf7"/>
<text x="70" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#15594f">약국 방문 전 확인 순서</text>
<text x="70" y="140" font-family="Arial,sans-serif" font-size="22" fill="#4d746d">지도에 표시된 영업정보와 실제 조제 가능 시간은 다를 수 있습니다.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(70 220)"><rect width="240" height="280" rx="24" fill="#fff" stroke="#61b9aa" stroke-width="4"/><circle cx="120" cy="70" r="38" fill="#188878"/><text x="120" y="84" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">1</text><text x="120" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#15594f">위치 확인</text><text x="120" y="190" text-anchor="middle" font-size="19" fill="#4d746d">약국명과 주소를</text><text x="120" y="220" text-anchor="middle" font-size="19" fill="#4d746d">지도에서 대조</text></g>
<g transform="translate(350 220)"><rect width="240" height="280" rx="24" fill="#fff" stroke="#61b9aa" stroke-width="4"/><circle cx="120" cy="70" r="38" fill="#188878"/><text x="120" y="84" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">2</text><text x="120" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#15594f">시간 확인</text><text x="120" y="190" text-anchor="middle" font-size="19" fill="#4d746d">야간·주말 운영과</text><text x="120" y="220" text-anchor="middle" font-size="19" fill="#4d746d">공휴일 여부 확인</text></g>
<g transform="translate(630 220)"><rect width="240" height="280" rx="24" fill="#fff" stroke="#61b9aa" stroke-width="4"/><circle cx="120" cy="70" r="38" fill="#188878"/><text x="120" y="84" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">3</text><text x="120" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#15594f">전화 문의</text><text x="120" y="190" text-anchor="middle" font-size="19" fill="#4d746d">처방전 조제와</text><text x="120" y="220" text-anchor="middle" font-size="19" fill="#4d746d">재고를 미리 확인</text></g>
<g transform="translate(910 220)"><rect width="220" height="280" rx="24" fill="#15594f"/><circle cx="110" cy="70" r="38" fill="#ffd166"/><text x="110" y="84" text-anchor="middle" font-size="38" font-weight="700" fill="#15594f">4</text><text x="110" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">대체 확인</text><text x="110" y="190" text-anchor="middle" font-size="19" fill="#dff7f2">불가할 때 가까운</text><text x="110" y="220" text-anchor="middle" font-size="19" fill="#dff7f2">다른 약국도 확인</text></g>
</g>
<text x="70" y="610" font-family="Arial,sans-serif" font-size="21" fill="#356b63">※ 정적 데이터만으로 현재 영업·조제 가능 여부를 확정하지 말고 공식 안내나 전화로 확인하세요.</text>
</svg>